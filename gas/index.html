        .layout {
          display: flex;
          height: 100vh;
          overflow: hidden;
          background-color: var(--bg-color);
        }

        /* Sidebar Styles */
        .sidebar {
          width: 260px;
          background: white;
          border-right: 1px solid var(--border-color);
          display: flex;
          flex-direction: column;
          transition: margin-left 0.3s ease, transform 0.3s ease;
          z-index: 50;
          flex-shrink: 0;
        }

        .sidebar.closed {
          margin-left: -260px;
        }

        .sidebar-header {
          padding: 16px 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
          display: flex;
          flex-direction: column;
          gap: 12px;
          align-items: flex-start;
        }

        .sidebar-logo {
          height: 32px;
          width: auto;
          object-fit: contain;
        }

        .logo-text h2 {
          margin: 0;
          font-size: 1.1rem;
          color: var(--primary-color);
          font-weight: 700;
          line-height: 1.2;
        }

        .badge {
          display: inline-block;
          background: #fff1f2;
          color: var(--primary-color);
          padding: 1px 8px;
          border-radius: 12px;
          font-size: 0.7rem;
          font-weight: 600;
          margin-top: 4px;
        }

        .sidebar-nav {
          flex: 1;
          padding: 16px;
          display: flex;
          flex-direction: column;
          gap: 8px;
        }

        .nav-item {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 12px 16px;
          border: none;
          background: transparent;
          color: var(--text-secondary);
          border-radius: 8px;
          cursor: pointer;
          font-family: inherit;
          font-weight: 500;
          transition: all 0.2s;
          text-align: left;
        }

        .nav-item:hover {
          background: #f1f5f9;
          color: var(--text-main);
        }

        .nav-item.active {
          background: var(--primary-color);
          color: white;
        }

        .sidebar-footer {
          padding: 16px;
          border-top: 1px solid var(--border-color);
        }

        .user-info {
          display: flex;
          align-items: center;
          gap: 12px;
          color: var(--text-main);
        }

        .user-info .name {
          margin: 0;
          font-weight: 600;
          font-size: 0.9rem;
        }

        .user-info .role {
          margin: 0;
          font-size: 0.8rem;
          color: var(--text-secondary);
        }

        /* Main Content */
        .main-content {
          flex: 1;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        .top-bar {
          height: 64px;
          background: white;
          border-bottom: 1px solid var(--border-color);
          display: flex;
          align-items: center;
          padding: 0 24px;
          gap: 16px;
        }

        .sync-status-badge {
          margin-left: auto;
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 4px 10px;
          background: #f1f5f9;
          color: #64748b;
          border-radius: 20px;
          font-size: 0.75rem;
          font-weight: 500;
        }

        .spin-icon {
          animation: layout-spin 1s linear infinite;
        }

        @keyframes layout-spin {
          100% { transform: rotate(360deg); }
        }

        .menu-btn {
          border: none;
          background: transparent;
          cursor: pointer;
          padding: 8px;

          }
